name: CI/CD Pipeline - Auth Service

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Download Dependencies
      run: cd ./auth-service && go mod download

    - name: Run Unit Tests
      run: cd ./auth-service && go test -v -cover ./...

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry (Simulated)
      # uses: docker/login-action@v3
      # with:
      #   username: ${{ secrets.DOCKERHUB_USERNAME }}
      #   password: ${{ secrets.DOCKERHUB_TOKEN }}
      run: echo "Skipping actual login for blueprint setup"

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./auth-service
        push: false # Set to true when registry credentials are provided
        tags: your-dockerhub-user/auth-service:latest
