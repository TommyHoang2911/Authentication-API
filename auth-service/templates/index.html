<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication API - Plan Flan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        dark: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-dark text-white min-h-screen flex flex-col justify-center items-center font-sans">

    <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl p-10 border border-slate-700 text-center">

        <div class="mb-6 inline-flex items-center justify-center w-20 h-20 bg-blue-500/20 rounded-full">
            <a href="https://github.com/TommyHoang2911/Authentication-API" target="_blank" class="text-blue-400 hover:text-blue-300 transition duration-200" aria-label="GitHub repository">
                <svg height="auto" viewBox="0 0 16 16" version="1.1" width="auto" aria-hidden="true">
                    <path fill-rule="evenodd"
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                    </path>
                </svg>
            </a>
        </div>

        <h1 class="text-4xl font-bold mb-2">Auth Service API</h1>
        <p class="text-slate-400 mb-8">Hệ thống xác thực bảo mật</p>

        <div class="mb-8 p-4 bg-slate-900 rounded-lg inline-block border border-slate-700">
            <div class="flex items-center space-x-3">
                <span id="status-indicator" class="relative flex h-3 w-3" aria-hidden="true">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span>
                </span>
                <span id="status-text" class="text-sm font-medium text-slate-300" aria-live="polite">Đang kiểm tra hệ thống...</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <a href="/auth/google/login"
                class="flex items-center justify-center space-x-2 bg-white text-slate-800 hover:bg-slate-100 py-3 px-4 rounded-lg font-semibold transition duration-200"
                id="google-login">
                <i class="fa-brands fa-google text-red-500"></i>
                <span>Login with Google</span>
            </a>

            <button id="facebook-login"
                class="flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-lg font-semibold transition duration-200"
                type="button">
                <i class="fa-brands fa-facebook text-white"></i>
                <span>Login with Facebook</span>
            </button>
        </div>

        <div class="flex flex-col space-y-3">
            <a href="/swagger/index.html"
                class="flex items-center justify-center space-x-2 bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg font-medium transition duration-200 border border-slate-600"
                id="swagger-link">
                <i class="fa-solid fa-book"></i>
                <span>Xem Tài liệu API (Swagger UI)</span>
            </a>

            <button id="qr-test"
                class="flex items-center justify-center space-x-2 bg-transparent hover:bg-slate-700 text-slate-300 py-3 px-4 rounded-lg font-medium transition duration-200 border border-slate-600"
                type="button">
                <i class="fa-solid fa-qrcode"></i>
                <span>Test QR Login Flow</span>
            </button>
        </div>
    </div>

    <footer class="mt-8 text-slate-500 text-sm">
        &copy; 2026 Developed by TommyHoang2911 (Duy Hy)
    </footer>

    <script src="/static/js/index.js" defer></script>
</body>

</html>
