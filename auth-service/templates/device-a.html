<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device A - QR Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div id="main-view" class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg text-center">
        <h1 class="text-2xl font-bold text-indigo-600 mb-2">Device A</h1>
        <p class="text-gray-500 mb-8">Scan the QR code displayed on Device B to authorize login.</p>

        <div class="mb-6 text-left">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="device-a-token">
                Access Token (Bearer):
            </label>
            <textarea id="device-a-token" rows="3" placeholder="Paste your JWT access token here..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-mono text-gray-600 shadow-inner"></textarea>
            <p class="text-xs text-gray-400 mt-1">Lấy token này từ API /login.</p>
        </div>

        <button onclick="openScanner()"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
            📷 Scan QR Code
        </button>

        <div class="mt-6 flex items-center justify-between">
            <hr class="w-full border-gray-300">
            <span class="p-2 text-gray-400 text-sm">OR</span>
            <hr class="w-full border-gray-300">
        </div>

        <div class="mt-4 flex gap-2">
            <input type="text" id="manual-code" placeholder="Enter QR ID manually"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="handleManualInput()"
                class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg transition">Submit</button>
        </div>
    </div>

    <div id="scanner-view" class="hidden w-full max-w-md bg-white p-4 rounded-xl shadow-lg flex flex-col items-center">
        <h2 class="text-xl font-bold mb-4">Scanning...</h2>
        <div id="reader" class="w-full rounded overflow-hidden shadow-inner"></div>
        <button onclick="closeScanner()"
            class="mt-4 w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition">
            Cancel Scanning
        </button>
    </div>

    <div id="confirm-modal" onclick="handleOverlayClick(event)" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center transform transition-all relative">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">Login Request</h3>
            <p class="text-gray-500 mb-6">Do you want to allow <strong>Device B</strong> to sign in to your account?</p>
            
            <div class="flex space-x-3">
                <button onclick="cancelLogin()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg transition">
                    Deny
                </button>
                <button onclick="confirmLogin()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition">
                    Allow
                </button>
            </div>
        </div>
    </div>

    <footer class="mt-8 text-slate-500 text-sm">
        &copy; 2026 Developed by TommyHoang2911 (Duy Hy)
    </footer>

    <script src="/static/js/device-a.js"></script>
</body>

</html>
