version: '3.8'

services:
  postgres_db:
    image: postgres:14-alpine
    container_name: auth_postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tommyhoang -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    depends_on:
      postgres_db:
        condition: service_healthy # Waits until DB is ready before starting API

volumes:
  postgres_data: